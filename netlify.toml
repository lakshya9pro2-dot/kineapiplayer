[build]
  publish = "."
  functions = "netlify/functions"

# 1. Typo correction
[[redirects]]
  from = "/move/*"
  to = "/movie/:splat"
  status = 301
  force = true

# 2. Serverless API routes -> handled by Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/version"
  to = "/.netlify/functions/api/version"
  status = 200

# 3. HTML Video Player Rewrites
[[redirects]]
  from = "/movie/*"
  to = "/player.html"
  status = 200

[[redirects]]
  from = "/tv/*"
  to = "/player.html"
  status = 200

[[redirects]]
  from = "/play=*"
  to = "/player.html"
  status = 200

# 4. Global CORS Headers
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS, HEAD"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-API-Key, Range"
